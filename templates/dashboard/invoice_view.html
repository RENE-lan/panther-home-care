{% extends "base.html" %}
{% load icons %}
{% block title %}Facture — Panther{% endblock %}
{% block heading %}Facture {{ inv.client.code }}{% endblock %}
{% block topbar_actions %}
<a class="btn btn-ghost btn-sm" href="{% url 'dashboard:billing' %}">← Facturation</a>
<a class="btn btn-approve btn-sm" href="{% url 'dashboard:invoice_print' inv.id %}?download" target="_blank">{% icon "download" 15 %} Télécharger</a>
<a class="btn btn-ghost btn-sm" href="{% url 'dashboard:invoice_print' inv.id %}" target="_blank">Imprimer</a>
{% endblock %}
{% block content %}
<div class="card" style="padding:0;overflow:hidden">
 <iframe src="{% url 'dashboard:invoice_print' inv.id %}#toolbar=1" style="width:100%;height:80vh;border:0;display:block"></iframe>
</div>
{% endblock %}
