# Render Blueprint — provisions everything: PostgreSQL + Django backend + React frontend.
# In Render: New → Blueprint → connect this repo. See DEPLOY.md for the full walkthrough.

databases:
  - name: panther-db
    plan: free
    region: frankfurt

services:
  # 1) Django backend + JSON API (also serves the full server-rendered app)
  - type: web
    name: panther-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt -r requirements-prod.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo --if-empty"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: panther-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://panther-frontend.onrender.com"
      - key: BACKEND_URL
        value: "https://panther-backend.onrender.com"
      # Optional keys — add in the Render dashboard (Environment tab), not here:
      #   AI_PROVIDER=anthropic   AI_API_KEY=sk-ant-...
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET, etc.

  # 2) React (Vite + TypeScript) static site
  - type: web
    name: panther-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://panther-backend.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
