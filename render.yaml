services:
  - type: web
    name: panther-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt -r requirements-prod.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo --if-empty"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        value: "https://panther-frontend.onrender.com"
      - key: BACKEND_URL
        value: "https://panther-backend.onrender.com"

  - type: web
    name: panther-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://panther-backend.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
